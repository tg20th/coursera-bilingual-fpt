<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Coursera Bilingual Transcript</title>
<style>
  :root {
    --primary: #0066cc;
    --primary-focus: #0071e3;
    --ink: #1d1d1f;
    --ink-muted-48: #7a7a7a;
    --hairline: rgba(0, 0, 0, 0.08);
    --canvas: #ffffff;
    --canvas-parchment: #f5f5f7;
    --on-primary: #ffffff;
    --success: #34c759;
    --warning: #ff9500;
    --radius-sm: 8px;
    --radius-lg: 20px;
    --radius-pill: 9999px;
  }
  * { box-sizing: border-box; }
  html {
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  html, body { margin: 0; }
  body {
    width: 336px;
    background: var(--canvas);
    border-radius: var(--radius-lg);
    overflow: hidden;
    padding: 22px 22px 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
      system-ui, "Segoe UI", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .brand .mark {
    width: 30px;
    height: 30px;
    border-radius: var(--radius-sm);
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .brand h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.374px;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    letter-spacing: -0.224px;
    color: var(--ink-muted-48);
    background: var(--canvas-parchment);
    border-radius: var(--radius-pill);
    padding: 5px 12px;
    margin-bottom: 20px;
  }
  .status .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ink-muted-48);
    flex-shrink: 0;
  }
  .status.ok { color: var(--success); }
  .status.ok .dot { background: var(--success); }
  .status.warn { color: var(--warning); }
  .status.warn .dot { background: var(--warning); }

  .field { margin-bottom: 6px; }
  .field label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.224px;
    margin-bottom: 8px;
  }

  .input-pill {
    display: flex;
    align-items: center;
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-pill);
    height: 44px;
    padding: 0 6px 0 20px;
  }
  .input-pill input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 15px;
    letter-spacing: -0.24px;
    color: var(--ink);
  }
  .input-pill input::placeholder { color: var(--ink-muted-48); }
  .input-pill:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.14);
  }

  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--ink-muted-48);
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--canvas-parchment); }
  .icon-btn:active { transform: scale(0.9); }

  .hint {
    display: block;
    font-size: 12px;
    letter-spacing: -0.12px;
    color: var(--ink-muted-48);
    margin: 8px 0 20px 20px;
  }
  .hint a { color: var(--primary); text-decoration: none; }
  .hint a:hover { text-decoration: underline; }

  .btn-primary {
    width: 100%;
    height: 44px;
    border: none;
    border-radius: var(--radius-pill);
    background: var(--primary);
    color: var(--on-primary);
    font-family: inherit;
    font-size: 15px;
    letter-spacing: -0.24px;
    cursor: pointer;
  }
  .btn-primary:active { transform: scale(0.96); }
  .btn-primary:focus-visible {
    outline: 2px solid var(--primary-focus);
    outline-offset: 2px;
  }

  #statusMsg {
    text-align: center;
    font-size: 12px;
    color: var(--success);
    height: 16px;
    margin-top: 10px;
  }

  footer {
    text-align: center;
    padding: 14px 0 18px;
    font-size: 11px;
    letter-spacing: -0.08px;
    line-height: 1.7;
    color: var(--ink-muted-48);
  }
  footer a { color: var(--primary); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="brand">
    <span class="mark">🌐</span>
    <h1>Coursera Bilingual Transcript</h1>
  </div>

  <div class="status" id="status">
    <span class="dot"></span>
    <span id="statusText">Đang kiểm tra...</span>
  </div>

  <div class="field">
    <label for="apiKey">Gemini API key</label>
    <div class="input-pill">
      <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off" />
      <button class="icon-btn" id="toggleKey" type="button" aria-label="Hiện hoặc ẩn API key">👁</button>
    </div>
  </div>
  <span class="hint">
    Lấy miễn phí tại
    <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>
  </span>

  <button class="btn-primary" id="save" type="button">Lưu cài đặt</button>
  <div id="statusMsg"></div>

  <footer>
    <a href="https://github.com/tg20th/coursera-bilingual-fpt" target="_blank" rel="noopener"
      >github.com/tg20th/coursera-bilingual-fpt</a
    ><br />
    © VibeCode by NhatTruong
  </footer>

  <script src="popup.js"></script>
</body>
</html>
