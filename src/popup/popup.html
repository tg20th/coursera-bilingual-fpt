<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Coursera Bilingual Transcript</title>
<style>
  :root {
    --brand: #2050ff;
    --brand-dark: #173bcf;
    --bg: #f7f8fc;
    --card: #ffffff;
    --text: #1a1a2e;
    --muted: #6b7280;
    --border: #e3e6ef;
    --ok: #17a35a;
    --warn: #d97706;
  }
  * { box-sizing: border-box; }
  body {
    width: 340px;
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: linear-gradient(135deg, var(--brand), #6a8bff);
    color: #fff;
    padding: 16px 18px;
  }
  header .logo-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header .logo {
    font-size: 20px;
  }
  header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 700;
  }
  header p {
    margin: 4px 0 0;
    font-size: 12px;
    opacity: 0.9;
  }
  main {
    padding: 16px 18px 8px;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 16px;
  }
  .status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .status.ok .dot { background: var(--ok); }
  .status.ok { color: var(--ok); }
  .status.warn .dot { background: var(--warn); }
  .status.warn { color: var(--warn); }

  label {
    display: block;
    font-weight: 600;
    font-size: 12.5px;
    margin-bottom: 6px;
    color: var(--text);
  }
  .field {
    margin-bottom: 14px;
  }
  .row {
    display: flex;
    gap: 6px;
  }
  input[type="password"],
  input[type="text"] {
    flex: 1;
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    background: var(--card);
    color: var(--text);
  }
  input:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(32, 80, 255, 0.12);
  }
  button.ghost {
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
  }
  button.ghost:hover { background: #f0f2fb; }

  .hint-link {
    display: block;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: -6px;
    margin-bottom: 14px;
  }
  .hint-link a { color: var(--brand); text-decoration: none; }
  .hint-link a:hover { text-decoration: underline; }

  button.primary {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: var(--brand);
    color: #fff;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button.primary:hover { background: var(--brand-dark); }
  button.primary:active { transform: translateY(1px); }

  #statusMsg {
    text-align: center;
    font-size: 12px;
    color: var(--ok);
    height: 16px;
    margin-top: 8px;
  }

  footer {
    text-align: center;
    padding: 12px 0 14px;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }
</style>
</head>
<body>
  <header>
    <div class="logo-row">
      <span class="logo">🌐</span>
      <h1>Coursera Bilingual Transcript</h1>
    </div>
    <p>Transcript song ngữ Anh-Việt, tự highlight theo lời giảng</p>
  </header>

  <main>
    <div class="status" id="status">
      <span class="dot"></span>
      <span id="statusText">Đang kiểm tra...</span>
    </div>

    <div class="field">
      <label for="apiKey">Gemini API key</label>
      <div class="row">
        <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off" />
        <button class="ghost" id="toggleKey" type="button">Hiện</button>
      </div>
    </div>
    <span class="hint-link">
      Lấy API key miễn phí tại
      <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>
    </span>

    <div class="field">
      <label for="model">Model</label>
      <input type="text" id="model" placeholder="gemini-2.5-flash" />
    </div>

    <button class="primary" id="save" type="button">Lưu cài đặt</button>
    <div id="statusMsg"></div>
  </main>

  <footer>© VibeCode by NhatTruong</footer>

  <script src="popup.js"></script>
</body>
</html>
